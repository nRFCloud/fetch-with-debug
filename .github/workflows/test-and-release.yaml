name: Test and Release

on: push

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  packages: write
  issues: write
  # Needed for trusted publishing to npm
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.18.1 <25"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Compile TypeScript
        run: npx tsc

      - run: npm test

      - name: Semantic release
        id: semantic-release
        run: npx semantic-release
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Also publish to npm, alongside GitHub Packages
      # Must also run if semantic-release failed after @semantic-release/npm
      # bumped the version (e.g. in @semantic-release/github), because the
      # tag is already pushed and the release will not be retried.
      - name: Publish to npm
        if: ${{ !cancelled() && steps.semantic-release.outcome != 'skipped' }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$version" = "0.0.0-development" ]; then
            echo "No new release, skipping."
            exit 0
          fi
          # The scope registry in .npmrc overrides --registry, so override the scope
          npm publish --@nrfcloud:registry=https://registry.npmjs.org
